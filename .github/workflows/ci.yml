name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install Linux sandbox dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor-profiles \
            bubblewrap \
            ca-certificates \
            curl \
            dnsutils \
            gcc \
            git \
            libseccomp-dev \
            netcat-openbsd \
            openssh-client \
            procps \
            python3 \
            ripgrep \
            socat \
            wget \
            zsh

      - name: Enable bubblewrap namespace support
        if: matrix.os == 'linux'
        run: |
          sudo chmod u+s "$(command -v bwrap)"
          bwrap --ro-bind / / --unshare-net true

      - name: Install macOS sandbox dependencies
        if: matrix.os == 'macos'
        run: |
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          brew list zsh >/dev/null 2>&1 || brew install zsh

      - name: Install Node dependencies
        run: npm ci

      - name: Build test artifacts
        run: npm run build

      - name: Run Bun test files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "::group::${test_file}"
            bun test "${test_file}"
            echo "::endgroup::"
          done < <(find test -name "*.test.ts" -print | sort)

      - name: Run Node fallback test
        run: node test/utils/which-node-test.mjs

      - name: Run Node runtime tests
        run: npm run test:node-runtime
